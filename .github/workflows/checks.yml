name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install pytest
        run: python -m pip install --upgrade pip pytest
      - name: tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q
      - name: single file must be regenerable (no hand edits)
        run: |
          python tools/build_single.py /tmp/regen.py 2>/dev/null || python tools/build_single.py regen.py
          python -c "import sys,pathlib; a=pathlib.Path('regen.py'); b=pathlib.Path('jellyfish.py'); sys.exit('jellyfish.py 与生成结果不一致' if a.read_text(encoding='utf-8')!=b.read_text(encoding='utf-8') else 0)"
      - name: single file runs standalone
        run: |
          python jellyfish.py tick --root ci-life --times 20
          python jellyfish.py export --root ci-life --out ci-life.html
